version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18 # Or whichever Node version your app uses
    commands:
      - npm install
  build:
    commands:
      - echo "Building application..."
      # If you are using TypeScript or a bundler, add your build command here (e.g., npm run build)

artifacts:
  files:
    - 'app.js'
    - 'package.json'
    - 'Procfile'
    - 'node_modules/**/*'
  # CRITICAL: Do NOT use a 'name' or 'discard-paths' property here 
  # that might alter the ZIP structure Beanstalk expects.
