version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "=== Fase INSTALL: Instalando dependencias ==="
      - npm install

  pre_build:
    commands:
      - echo "=== Fase PRE_BUILD: Verificando entorno ==="
      - node --version
      - npm --version
      - echo "Dependencias instaladas correctamente"

  build:
    commands:
      - echo "=== Fase BUILD: Ejecutando pruebas ==="
      - npm test
      - echo "Build completado en $(date)"

  post_build:
    commands:
      - echo "=== Fase POST_BUILD: Empaquetando artefacto ==="
      - zip -r app-deploy.zip . -x "*.git*" -x "node_modules/*"
      - echo "Artefacto generado exitosamente"

artifacts:
  files:
    - app.js
    - package.json
    - package-lock.json
    - Procfile
    - "**/*"
  discard-paths: no
  base-directory: "."

cache:
  paths:
    - node_modules/**/*
